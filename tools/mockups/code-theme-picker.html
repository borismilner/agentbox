<!-- Code-theme picker: browse agentbox's code-highlighting palettes on a sample
     rendered by the real Go pipeline, then click one to make it the config.
     The data blob (sample HTML + every theme resolved through BuildTheme) is
     generated by gen-picker-data.go (go run tools/mockups/gen-picker-data.go) and baked in below; regenerate and
     re-inject if tokens.go changes. Throwaway in the tools/mockups spirit:
     the decisions it produces live in config.toml, not here. -->
<div id="app">
  <header>
    <div class="title">Code highlighting</div>
    <div class="chips" id="chips"></div>
    <div class="mode" id="mode">
      <button data-mode="dark" class="on">dark</button>
      <button data-mode="light">light</button>
    </div>
    <button id="use">Use auto</button>
  </header>
  <div class="legend" id="legend"></div>
  <main id="sample"></main>
  <footer>Keys: 1-6 pick a theme &middot; d / l switch mode &middot; Enter applies. The mode toggle only previews; agentbox keeps following the desktop theme.</footer>
</div>

<style>
  :root {
    font-family: var(--k-font-ui, system-ui, sans-serif);
  }
  body {
    margin: 0;
    background: var(--p-ground);
    color: var(--p-ink);
    transition: background 140ms ease, color 140ms ease;
  }
  #app {
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 22px 30px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-right: 4px;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chips button,
  .mode button {
    font: inherit;
    font-size: 0.82rem;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--p-edge);
    background: var(--p-surface);
    color: var(--p-ink2);
    cursor: pointer;
  }
  .chips button.on,
  .mode button.on {
    border-color: var(--p-accent);
    color: var(--p-ink);
    box-shadow: inset 0 0 0 1px var(--p-accent);
  }
  .mode {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  #use {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid var(--p-accent);
    background: var(--p-accent);
    color: #fff;
    cursor: pointer;
  }
  #use:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .legend {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 14px;
    font-size: 0.72rem;
    color: var(--p-ink2);
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 3px;
    margin-right: 5px;
    background: var(--sw);
    vertical-align: -1px;
  }
  footer {
    margin-top: 14px;
    font-size: 0.74rem;
    color: var(--p-ink3);
  }

  /* The code block chrome, matching app.css .k-code */
  .k-code {
    border: 1px solid var(--p-edge);
    border-radius: 8px;
    background: var(--p-surface2);
    overflow: hidden;
    position: relative;
    margin: 0 0 14px;
  }
  .k-code::before {
    content: attr(data-lang);
    position: absolute;
    top: 4px;
    right: 9px;
    font-family: var(--p-mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--p-ink3);
    pointer-events: none;
  }
  .k-code pre {
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    font-family: var(--p-mono);
    font-size: 0.8rem;
    line-height: 1.62;
  }
  .k-copy {
    display: none;
  }
  .chroma {
    background: transparent;
  }
  .chroma .lntable {
    width: 100%;
    border: 0;
    margin: 0;
    border-collapse: collapse;
    display: block;
    overflow-x: auto;
  }
  .chroma .lntable td {
    border: 0;
    padding: 0;
    background: none;
    vertical-align: top;
  }
  .chroma .lntd:first-child {
    width: 1%;
    white-space: nowrap;
    user-select: none;
  }
  .chroma .lnt,
  .chroma .ln {
    color: color-mix(in srgb, var(--p-ink3) 62%, transparent);
    padding-right: 4px;
  }

  /* The eleven roles - a standalone copy of app.css's .chroma mapping,
     driven by --c-* so a theme switch is a variable write. */
  .chroma .k, .chroma .kd, .chroma .kn, .chroma .kp, .chroma .kr { color: var(--c-kw); }
  .chroma .kt, .chroma .nc, .chroma .nn, .chroma .ne { color: var(--c-typ); }
  .chroma .kc, .chroma .no, .chroma .nb, .chroma .bp, .chroma .vm { color: var(--c-cons); }
  .chroma .nt, .chroma .na, .chroma .nd, .chroma .ni, .chroma .nl { color: var(--c-attr); }
  .chroma .s, .chroma .s1, .chroma .s2, .chroma .sb, .chroma .sc,
  .chroma .sd, .chroma .sh, .chroma .sa { color: var(--c-str); }
  .chroma .se, .chroma .si, .chroma .sx, .chroma .sr, .chroma .ss { color: var(--c-esc); }
  .chroma .m, .chroma .mb, .chroma .mf, .chroma .mh, .chroma .mi,
  .chroma .il, .chroma .mo { color: var(--c-num); }
  .chroma .nf, .chroma .fm { color: var(--c-fn); }
  .chroma .o, .chroma .ow { color: var(--c-op); }
  .chroma .p { color: var(--c-punct); }
  .chroma .c, .chroma .ch, .chroma .cm, .chroma .c1, .chroma .cs {
    color: var(--c-com);
    font-style: italic;
  }
  .chroma .cp { color: var(--c-kw); }
  .chroma .cpf { color: var(--c-str); }
  .chroma .err { color: var(--p-error); }
  .chroma .gd { color: var(--p-error); background: color-mix(in srgb, var(--p-error) 11%, transparent); }
  .chroma .gi { color: var(--p-success); background: color-mix(in srgb, var(--p-success) 11%, transparent); }
  .chroma .ge { font-style: italic; }
  .chroma .gs { font-weight: 600; }
  .chroma .gh, .chroma .gu { color: var(--c-fn); font-weight: 600; }
  .chroma .gp { color: var(--p-ink3); user-select: none; }
  .chroma .go { color: var(--p-ink2); }
  .chroma .gt { color: var(--p-error); }
</style>

  let theme = "auto";
  let mode = 0; // 0 dark, 1 light

  const ROLES = [
    ["keyword", "codeKeyword"], ["type", "codeType"], ["constant", "codeConst"],
    ["function", "codeFunc"], ["string", "codeString"], ["escape", "codeEsc"],
    ["number", "codeNumber"], ["attribute", "codeAttr"], ["operator", "codeOp"],
    ["punct", "codePunct"], ["comment", "codeComment"],
  ];

  const root = document.documentElement;

  function apply() {
    const t = DATA.themes[theme][mode];
    const page = {
      "--p-ground": t.ground, "--p-surface": t.surface, "--p-surface2": t.surface2,
      "--p-edge": t.edge, "--p-ink": t.ink, "--p-ink2": t.ink2, "--p-ink3": t.ink3,
      "--p-accent": t.accent, "--p-error": t.error, "--p-success": t.success,
      "--p-mono": t.fontMono,
      "--c-kw": t.codeKeyword, "--c-str": t.codeString, "--c-num": t.codeNumber,
      "--c-fn": t.codeFunc, "--c-com": t.codeComment, "--c-typ": t.codeType,
      "--c-cons": t.codeConst, "--c-attr": t.codeAttr, "--c-esc": t.codeEsc,
      "--c-op": t.codeOp, "--c-punct": t.codePunct,
    };
    for (const [k, v] of Object.entries(page)) root.style.setProperty(k, v);

    document.querySelectorAll("#chips button").forEach((b) =>
      b.classList.toggle("on", b.dataset.theme === theme));
    document.querySelectorAll("#mode button").forEach((b) =>
      b.classList.toggle("on", b.dataset.mode === (mode ? "light" : "dark")));
    document.getElementById("use").textContent = "Use " + theme;

    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    for (const [label, key] of ROLES) {
      const s = document.createElement("span");
      s.style.setProperty("--sw", t[key]);
      s.textContent = label;
      legend.appendChild(s);
    }
  }

  const chips = document.getElementById("chips");
  for (const name of DATA.order) {
    const b = document.createElement("button");
    b.textContent = name;
    b.dataset.theme = name;
    b.onclick = () => { theme = name; apply(); };
    chips.appendChild(b);
  }
  document.querySelectorAll("#mode button").forEach((b) => {
    b.onclick = () => { mode = b.dataset.mode === "light" ? 1 : 0; apply(); };
  });

  const use = document.getElementById("use");
  use.onclick = () => {
    window.agentbox.emit("theme-picked", { theme });
    use.disabled = true;
    use.textContent = "picked " + theme + " - applying";
  };

  document.addEventListener("keydown", (e) => {
    const i = e.key.charCodeAt(0) - 49; // '1'
    if (i >= 0 && i < DATA.order.length && e.key.length === 1 && e.key >= "1" && e.key <= "9") {
      theme = DATA.order[i]; apply();
    } else if (e.key === "d") { mode = 0; apply(); }
    else if (e.key === "l") { mode = 1; apply(); }
    else if (e.key === "Enter" && !use.disabled) { use.onclick(); }
  });

  document.getElementById("sample").innerHTML = DATA.sample;
  apply();
</script>
