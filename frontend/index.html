<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- img-src alone, with no default-src, so this restricts images and nothing
         else. Go inlines every image it accepts as a data: URI and refuses to
         emit a remote one (internal/webui/images.go); this is a second, independent
         check on the same rule, so a future edit there cannot quietly turn an agent's
         prose into a request to a host you never saw. -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:" />
    <title>agentbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
